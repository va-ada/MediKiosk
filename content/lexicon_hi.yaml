# DRAFT — clinician review required
# Folk terms → concepts, negation cues, number words, unit words (CONTRACTS.md §9.4).
# `ambiguous: true` means the doctor must clarify (e.g. "BP" can mean high or low).
terms:
  - {match: ["sugar", "शुगर", "madhumeh", "मधुमेह", "diabetes", "डायबिटीज़", "डायबिटीज"], concept: "diabetes", ambiguous: false}
  - {match: ["bp", "बीपी", "blood pressure", "ब्लड प्रेशर"], concept: "blood pressure problem", ambiguous: true}
  - {match: ["high bp", "हाई बीपी"], concept: "high blood pressure", ambiguous: false}
  - {match: ["low bp", "लो बीपी"], concept: "low blood pressure", ambiguous: false}
  - {match: ["gas", "गैस", "vayu", "वायु"], concept: "gas / bloating", ambiguous: true}
  - {match: ["acidity", "एसिडिटी", "khatti dakar", "खट्टी डकार"], concept: "acidity / acid reflux", ambiguous: false}
