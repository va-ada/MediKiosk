  - {match: ["kabz", "qabz", "कब्ज़", "कब्ज"], concept: "constipation", ambiguous: false}
  - {match: ["dast", "दस्त", "loose motion", "लूज़ मोशन", "पतले दस्त"], concept: "diarrhoea", ambiguous: false}
